name: Historias Marcador CL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: historias
  cancel-in-progress: false

jobs:
  historias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Buscar partidos terminados
        run: python3 historias/buscar.py

      - name: Revisar si hay imágenes por generar
        id: hay
        run: echo "n=$(python3 -c 'import json;print(len(json.load(open("historias/pendientes.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Instalar navegador
        if: steps.hay.outputs.n != '0'
        run: |
          pip install playwright==1.47.0
          python3 -m playwright install --with-deps chromium

      - name: Generar imágenes
        if: steps.hay.outputs.n != '0'
        run: python3 historias/render.py historias/pendientes.json

      - name: Guardar cambios
        run: |
          git config user.name "marcador-cl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historias
          git diff --cached --quiet && exit 0
          git commit -m "Historias $(TZ=America/Santiago date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main
          git push
