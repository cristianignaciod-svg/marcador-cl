name: Historias Marcador CL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      debug_fm:
        description: "ID de partido FotMob para probar el detalle (opcional)"
        required: false
        default: ""
      verificar:
        description: "Solo verificar la conexión con Instagram (si/no)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: historias
  cancel-in-progress: false

jobs:
  historias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Buscar partidos terminados
        env:
          DEBUG_FM_ID: ${{ github.event.inputs.debug_fm }}
        run: python3 historias/buscar.py

      - name: Revisar si hay imágenes por generar
        id: hay
        run: echo "n=$(python3 -c 'import json;print(len(json.load(open("historias/pendientes.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Instalar navegador
        if: steps.hay.outputs.n != '0'
        run: |
          pip install playwright==1.47.0
          python3 -m playwright install --with-deps chromium

      - name: Generar imágenes
        if: steps.hay.outputs.n != '0'
        run: python3 historias/render.py historias/pendientes.json

      - name: Guardar cambios
        run: |
          git config user.name "marcador-cl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historias
          git diff --cached --quiet && exit 0
          git commit -m "Historias $(TZ=America/Santiago date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main
          git push

      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLICAR_HISTORIAS: ${{ vars.PUBLICAR_HISTORIAS }}
          PUBLICAR_RESUMENES: ${{ vars.PUBLICAR_RESUMENES }}
          SOLO_VERIFICAR: ${{ github.event.inputs.verificar }}
        run: |
          export SHA=$(git rev-parse HEAD)
          python3 historias/publicar.py
          git add historias/cola.json historias/estado_instagram.json
          git diff --cached --quiet && exit 0
          git commit -m "Instagram: publicaciones $(TZ=America/Santiago date +'%H:%M')"
          git pull --rebase -q origin main
          git push

      # GitHub no está ejecutando el horario (cron) de forma confiable: cada pasada deja
      # programada la siguiente ~10 minutos después. Si la cadena se corta, la tarea horaria
      # de Claude la vuelve a lanzar.
      - name: Programar siguiente pasada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          gh api -X POST repos/${{ github.repository }}/actions/workflows/historias.yml/dispatches -f ref=main
