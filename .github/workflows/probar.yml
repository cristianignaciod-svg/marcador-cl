name: Probar fuente Sofascore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 historias/debug_sofascore.py
          git config user.name marcador-cl-bot
          git config user.email actions@users.noreply.github.com
          git add historias/debug
          git commit -m "Prueba Sofascore"
          git push
