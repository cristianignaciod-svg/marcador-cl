name: Probar Chrome
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for i in 1 2 3; do pip install -q playwright==1.47.0 && break; sleep 20; done
          command -v google-chrome && google-chrome --version
          echo '[{"id":"prueba-chrome","liga":"esp.1","fase":"","fecha":"2000-01-01","local":"Atlético","visita":"Deportivo","gl":1,"gv":0,"goles":[{"min":"48'"'"'","jugador":"Julián Álvarez","lado":"local"}]}]' > /tmp/p.json
          python3 historias/render.py /tmp/p.json
          ls -la historias/img/2000-01-01/
          mkdir -p historias/debug && google-chrome --version > historias/debug/chrome.txt && ls historias/img/2000-01-01/ >> historias/debug/chrome.txt
          git config user.name marcador-cl-bot; git config user.email actions@users.noreply.github.com
          git add historias/debug; git commit -m "Prueba Chrome"; git push
